name: /pub/electromechanics/switches/mini-rocker
desc: Photo-derived miniature three-terminal II-O-I rocker switch
cover:
  part: mini-ii-o-i

parts:
  mini-ii-o-i:
    type: scad
    path: mini-ii-o-i.scad
    model_role: electronic_component
    desc: Parametric exterior of the photographed miniature three-terminal rocker switch
    vendor: unknown
    sku: unknown
    url: https://probots.co.in/technical_data/switches/Probots-KCD11-Rocker-Switch-Datasheet.pdf
    narys:
      accuracy:
        schema_version: 1
        basis: Manufacturer RS-001G (KCD11) drawing cross-checked against calibrated ruler photographs
        datum: Panel plane is Z=0; bezel and terminal matrix are centered on X=0 and Y=0
        critical_dimensions:
          - id: bezel_width
            nominal: 15.0
            unit: mm
            tolerance: "+/-0.10 mm"
            source: Top Willing RS-001G (KCD11) series drawing, dimension D
          - id: bezel_height
            nominal: 10.5
            unit: mm
            tolerance: "+/-0.10 mm"
            source: Top Willing RS-001G (KCD11) series drawing, dimension E
          - id: panel_cutout_width
            nominal: 13.8
            unit: mm
            tolerance: "+/-0.5 mm drawing general tolerance"
            source: Top Willing RS-001G (KCD11) series drawing, panel cutout
          - id: panel_cutout_height
            nominal: 9.2
            unit: mm
            tolerance: "+/-0.3 mm drawing general tolerance"
            source: Top Willing RS-001G (KCD11) series drawing, panel cutout
          - id: body_depth_below_panel
            nominal: 10.2
            unit: mm
            tolerance: "+/-0.5 mm drawing general tolerance"
            source: Top Willing RS-001G (KCD11) series drawing
          - id: terminal_pitch
            nominal: 5.0
            unit: mm
            tolerance: "+/-0.10 mm"
            source: Top Willing RS-001G (KCD11) series drawing, dimension C
          - id: terminal_thickness
            nominal: 0.4
            unit: mm
            tolerance: "+/-0.02 mm"
            source: Top Willing RS-001G (KCD11) series drawing, dimension A
          - id: terminal_blade_width
            nominal: 3.7
            unit: mm
            tolerance: "+/-0.05 mm"
            source: Top Willing RS-001G (KCD11) series drawing, dimension B
        approximations:
          - feature: rocker_curvature_face_markings_and_snap_clip_surface_detail
            scope: non_functional_cosmetic
            intended_use: visual identification and coarse exterior clearance only
          - feature: terminal_eye_slots
            scope: non_functional_cosmetic
            intended_use: visual identification; not a tooling profile
      representations:
        schema_version: 1
        files:
          - format: scad
            path: mini-ii-o-i.scad
            geometry_scope: exterior
            primary: true
          - format: stl
            path: mini-ii-o-i.stl
            geometry_scope: exterior

render:
  svg:
  readme:
