name: //pub/narysai/comp-ivins-case-4
desc: Raspberry Pi 5 enclosure parts for the Pineboards AI Bundle.
partcad: ">=0.7.147"
manufacturable: true

docs:
  usage: |
    ```shell
    pc inspect enclosure-bottom
    pc inspect enclosure-top
    pc inspect thermal-insert
    ```

parts:
  enclosure-bottom:
    type: stl
    path: tmp/input/Raspberry_pi_5__case_with_pineboards_AI_Bundle_BOTTOM_v1.stl
    desc: Bottom shell for the Raspberry Pi 5 and Pineboards AI Bundle enclosure.
  enclosure-top:
    type: stl
    path: tmp/input/Raspberry_pi_5__case_with_pineboards_AI_Bundle_TOP_v1.stl
    desc: Top shell for the Raspberry Pi 5 and Pineboards AI Bundle enclosure.
  thermal-insert:
    type: 3mf
    path: tmp/input/thermal2.3mf
    desc: Thermal insert model supplied with the enclosure design.

render:
  readme:
  svg:
    prefix: ./
  png:
    prefix: ./
