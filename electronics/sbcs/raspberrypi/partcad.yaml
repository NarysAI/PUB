name: /pub/electronics/sbcs/raspberrypi
desc: Raspberry Pi product catalog
url: https://www.raspberrypi.com/
partcad: ">=0.6.0"
cover:
  part: rpi4b

import:
  pub:
    onlyInRoot: True
    type: git
    url: https://github.com/openvmp/partcad-index.git
  rpi4:
    type: local
    path: boards/rpi4
  rpi5:
    type: local
    path: boards/rpi5
  displays:
    type: local
    path: accessories/displays

# Backward-compatible aliases. New consumers should use the family packages.
parts:
  rpi4b:
    type: alias
    source: rpi4:rpi4b
    desc: Raspberry Pi 4 Model B
  rpi5:
    type: alias
    source: rpi5:rpi5
    desc: Parametric Raspberry Pi 5 with Active Cooler
  rpi5-active-cooler:
    type: alias
    source: rpi5:rpi5-active-cooler
    desc: Raspberry Pi 5 with Active Cooler
  rpi-touchscreen:
    type: alias
    source: displays:rpi-touchscreen
    desc: Raspberry Pi 7" Touchscreen Display

render:
  svg:
  readme:
