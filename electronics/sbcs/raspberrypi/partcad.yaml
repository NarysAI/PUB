name: /pub/electronics/sbcs/raspberrypi
desc: Raspberry Pi product catalog
url: https://www.raspberrypi.com/
partcad: ">=0.6.0"
cover:
  part: rpi4b

import:
  pub:
    onlyInRoot: True
    type: git
    url: https://github.com/openvmp/partcad-index.git
  rpi4:
    type: local
    path: boards/rpi4
  rpi5:
    type: local
    path: boards/rpi5
  displays:
    type: local
    path: accessories/displays

# Backward-compatible concrete entries. New consumers should use the family packages.
parts:
  rpi4b:
    type: step
    path: boards/rpi4/rpi4b.step
    desc: Raspberry Pi 4 Model B
  rpi5:
    type: scad
    path: boards/rpi5/rpi5.scad
    desc: Parametric Raspberry Pi 5 with Active Cooler
  rpi5-active-cooler:
    type: scad
    path: boards/rpi5/rpi5.scad
    desc: Raspberry Pi 5 with Active Cooler
  rpi-touchscreen:
    type: step
    path: accessories/displays/rpi-touchscreen.step
    desc: Raspberry Pi 7" Touchscreen Display

render:
  svg:
  readme:
