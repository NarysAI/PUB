          - id: overall_width
            nominal: 24.0
            model_value: 24.0
            unit: mm
            tolerance: 0.05
            source: Matek Systems BEC12S-PRO product specification
          - id: overall_height
            nominal: 5.5
            model_value: 5.5
            unit: mm
            tolerance: 0.05
            source: Matek Systems BEC12S-PRO product specification
          - id: input_pad_pitch
            nominal: 3.81
            model_value: 3.81
            unit: mm
            tolerance: 0.01
            source: Matek Systems BEC12S-PRO product specification
        approximations:
          - feature: component_bodies_pad_shapes_and_silkscreen
            scope: non_functional_cosmetic
            intended_use: recognizable preview and coarse enclosure clearance only
          - feature: pcb_corner_radius
            scope: non_functional_cosmetic
            intended_use: placement visualization; not a fabrication outline
      representations:
        schema_version: 1
        files:
          - format: scad
            path: matek-bec12s-pro.scad
            geometry_scope: exterior
