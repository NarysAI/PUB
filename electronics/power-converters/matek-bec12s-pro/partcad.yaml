    desc: Dimensioned Matek BEC12S-PRO placement and clearance model
    vendor: Matek Systems
    sku: BEC12S-PRO
    url: https://grabcad.com/library/matek-12s-pro-bec-9-55v-input-5v-8v-12v-5a-output-1
    narys:
      accuracy:
        schema_version: 2
        basis: manufacturer_specification_and_public_reference_renderings
