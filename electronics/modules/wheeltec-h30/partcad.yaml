name: //pub/electronics/modules/wheeltec-h30
desc: WHEELTEC H30 IMU product family with exact PCB and enclosed variants.
license_status: unverified

parts:
  h30-pcb:
    type: scad
    path: h30-pcb.scad
    model_role: electronic_component
    desc: Approximate visual and mechanical model of the bare WHEELTEC H30 IMU PCB.
    vendor: WHEELTEC
    sku: H30-PCB
    url: https://github.com/Seeed-Projects/WHEELTEC-H30-IMU/tree/main/5.Mechanical%20model%20files
    narys:
      representations:
        schema_version: 1
        files:
          - format: scad
            path: h30-pcb.scad
            geometry_scope: exterior
            primary: true
          - format: stl
            path: h30-pcb.stl
            geometry_scope: exterior
      product:
        schema_version: 1
        family_id: wheeltec-h30
        family_name: WHEELTEC H30
        variant_id: h30-pcb
        variant_name: H30 PCB
        variant_kind: base
        revision: "1.0"
        aliases:
          - kind: part
            semantic_path: electronics/modules/wheeltec-h30wp:wheeltec-h30wp

  h30-enclosed:
    type: stl
    path: h30-enclosed.stl
    model_role: electronic_component
    desc: WHEELTEC H30 enclosed variant with the H30 PCB inside a metal housing.
    vendor: WHEELTEC
    sku: H30-ENCLOSED
    url: https://github.com/Seeed-Projects/WHEELTEC-H30-IMU/blob/main/5.Mechanical%20model%20files/WHEELTEC_H30%20Sensor%20%28metal%20housing%29.stp
    narys:
      representations:
        schema_version: 1
        files:
          - format: scad
            path: h30-enclosed.scad
            geometry_scope: exterior
          - format: stl
            path: h30-enclosed.stl
            geometry_scope: exterior
            primary: true
      product:
        schema_version: 1
        family_id: wheeltec-h30
        family_name: WHEELTEC H30
        variant_id: h30-enclosed
        variant_name: H30 Enclosed
        variant_kind: enclosed
        revision: "1.3"
        base_variant:
          kind: part
          semantic_path: electronics/modules/wheeltec-h30:h30-pcb
          label: H30 PCB
        components:
          - kind: part
            semantic_path: electronics/modules/wheeltec-h30:h30-pcb
            label: H30 PCB
            quantity: 1
            role: electronics
          - kind: part
            semantic_path: electronics/modules/wheeltec-h30:h30-main-housing
            label: H30 Main Housing
            quantity: 1
            role: housing
          - kind: part
            semantic_path: electronics/modules/wheeltec-h30:h30-cover
            label: H30 Cover
            quantity: 1
            role: cover
          - kind: part
            semantic_path: electronics/modules/wheeltec-h30:h30-cover-screw
            label: H30 Cover Screw
            quantity: 4
            role: fastener
          - kind: part
            semantic_path: electronics/modules/wheeltec-h30:h30-plastic-damper-screw
            label: H30 Plastic Damper Screw
            quantity: 4
            role: vibration_isolator

  h30-main-housing:
    type: stl
    path: h30-main-housing.stl
    model_role: mechanical_component
    desc: Main metal housing and mounting base for the WHEELTEC H30 Enclosed variant.
    vendor: WHEELTEC
    narys:
      representations:
        schema_version: 1
        files:
          - format: scad
            path: h30-main-housing.scad
